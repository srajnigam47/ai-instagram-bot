name: AI Instagram Bot

on:
  schedule:
    # Frequent check-in instead of exact-time slots: GitHub's cron
    # trigger is known to silently skip firings on low-traffic repos,
    # so 5 exact slots means any one dropped firing = a missed post.
    # bot.py only actually posts if >=4.5h passed since the last post
    # (see src/post_state.py), targeting ~5 posts/day. Offset by 7/37
    # past the hour to avoid the most congested :00/:30 trigger times.
    - cron: '7,37 * * * *'

  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual trigger reason'
        required: false
        default: 'Manual post'

permissions:
  contents: write   # needed to create/delete GitHub Releases for video hosting

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: |
          # Try apt first (fast on Ubuntu 24.04); fall back to BtbN static build
          if sudo apt-get install -y --no-install-recommends ffmpeg 2>/dev/null; then
            echo "Installed via apt"
          else
            echo "apt failed — downloading BtbN static build from GitHub CDN"
            wget -q "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-linux64-gpl.tar.xz" -O ffmpeg.tar.xz
            tar xf ffmpeg.tar.xz
            sudo install -m755 ffmpeg-*/bin/ffmpeg /usr/local/bin/ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Install Python dependencies
        run: pip install requests pillow numpy

      - name: Run Instagram Bot
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID:   ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          GROQ_API_KEY:           ${{ secrets.GROQ_API_KEY }}
          HF_API_KEY:             ${{ secrets.HF_API_KEY }}
          IMGBB_API_KEY:          ${{ secrets.IMGBB_API_KEY }}
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN:           ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:      ${{ github.repository }}
        run: |
          cd src
          python bot.py

      - name: Done
        if: always()
        run: echo "Completed at $(date)"

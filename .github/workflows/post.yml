name: AI Instagram Bot 🤖

on:
  schedule:
    - cron: '30 2 * * *'   # 8:00 AM IST
    - cron: '30 7 * * *'   # 1:00 PM IST
    - cron: '30 13 * * *'  # 7:00 PM IST

  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual trigger reason'
        required: false
        default: 'Manual post'

permissions:
  contents: write  # needed to create/delete GitHub Releases for video hosting

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests fal-client

      - name: Run Instagram Bot
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID:   ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          GROQ_API_KEY:           ${{ secrets.GROQ_API_KEY }}
          HF_API_KEY:             ${{ secrets.HF_API_KEY }}
          IMGBB_API_KEY:          ${{ secrets.IMGBB_API_KEY }}
          FAL_API_KEY:            ${{ secrets.FAL_API_KEY }}
          GITHUB_TOKEN:           ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:      ${{ github.repository }}
        run: |
          cd src
          python bot.py

      - name: Log result
        if: always()
        run: echo "Bot run completed at $(date)"

name: AI Instagram Bot

on:
  schedule:
    - cron: '30 1 * * *'   # 7:00 AM IST
    - cron: '0 5 * * *'    # 10:30 AM IST
    - cron: '0 8 * * *'    # 1:30 PM IST
    - cron: '30 11 * * *'  # 5:00 PM IST
    - cron: '30 15 * * *'  # 9:00 PM IST

  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual trigger reason'
        required: false
        default: 'Manual post'

permissions:
  contents: write   # needed to create/delete GitHub Releases for video hosting

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: |
          # Try apt first (fast on Ubuntu 24.04); fall back to BtbN static build
          if sudo apt-get install -y --no-install-recommends ffmpeg 2>/dev/null; then
            echo "Installed via apt"
          else
            echo "apt failed — downloading BtbN static build from GitHub CDN"
            wget -q "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-linux64-gpl.tar.xz" -O ffmpeg.tar.xz
            tar xf ffmpeg.tar.xz
            sudo install -m755 ffmpeg-*/bin/ffmpeg /usr/local/bin/ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Install Python dependencies
        run: pip install requests

      - name: Run Instagram Bot
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID:   ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          GROQ_API_KEY:           ${{ secrets.GROQ_API_KEY }}
          HF_API_KEY:             ${{ secrets.HF_API_KEY }}
          IMGBB_API_KEY:          ${{ secrets.IMGBB_API_KEY }}
          GITHUB_TOKEN:           ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:      ${{ github.repository }}
        run: |
          cd src
          python bot.py

      - name: Done
        if: always()
        run: echo "Completed at $(date)"
